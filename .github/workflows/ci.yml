name: Build & test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Keep source compilation and concurrent Go tests within the hosted runner.
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      FRY_PROTO_BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
      # Keep cached inputs separate from test evidence and runner-preinstalled tools.
      GOCACHE: ${{ github.workspace }}/.artifacts/cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.artifacts/cache/go-mod
      npm_config_cache: ${{ github.workspace }}/.artifacts/cache/npm
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.artifacts/cache/lint
      MISE_CONFIG_DIR: ${{ github.workspace }}/.artifacts/native-toolchain/config
      MISE_SYSTEM_CONFIG_DIR: ${{ github.workspace }}/.artifacts/native-toolchain/system-config
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: '2026.10.13'
          sha256: '94c45523c7b6760b7da704f16051171ca32e8447a849a02266a439a4455e9a12'
          install: true
          install_args: --locked
          cache: true
          cache_key_prefix: fry-mise-v1
      - name: Restore dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/cache/go-mod
            .artifacts/cache/npm
            .artifacts/native-toolchain/x86_64/go-mod
          key: fry-deps-v1-ubuntu24-${{ runner.arch }}-${{ hashFiles('mise.lock', 'go.mod', 'go.sum', 'third_party/**/go.mod', 'third_party/**/go.sum', 'tooling/**/go.mod', 'tooling/**/go.sum', 'tooling/rpc/package-lock.json', 'scripts/browser/package-lock.json') }}
          restore-keys: |
            fry-deps-v1-ubuntu24-${{ runner.arch }}-
      - name: Cache builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/cache/go-build
            .artifacts/cache/lint
          # Refresh immutable compilation caches after source changes; Go and
          # golangci-lint validate restored entries against their actual inputs.
          key: fry-build-v1-ubuntu24-${{ runner.arch }}-${{ hashFiles('mise.lock', 'tooling/native/**/go.mod', 'tooling/native/**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            fry-build-v1-ubuntu24-${{ runner.arch }}-${{ hashFiles('mise.lock', 'tooling/native/**/go.mod', 'tooling/native/**/go.sum') }}-
      - name: Restore Chromium
        id: chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/browser/browsers
          key: fry-chromium-v1-ubuntu24-${{ runner.arch }}-${{ hashFiles('scripts/browser/package-lock.json') }}
      - name: Setup tools
        run: make setup-tools doctor
      - name: Pull test images
        run: make test-deps-pull
      - name: Setup scanners
        run: make security-setup
      - name: Setup browser
        run: make browser-setup BROWSER_SETUP_FLAGS=--with-deps
      # Save prepared downloads before tests so a test failure does not discard
      # them. No credentials, service data, reports or pass markers are cached.
      - name: Save dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .artifacts/cache/go-mod
            .artifacts/cache/npm
            .artifacts/native-toolchain/x86_64/go-mod
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Save Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/browser/browsers
          key: ${{ steps.chromium.outputs.cache-primary-key }}
      - name: Validate
        run: make check
      - name: Package container
        run: |
          runtime=$(awk '$1 == "FROM" {print $2}' Dockerfile)
          docker pull --platform linux/amd64 "$runtime"
          make container IMAGE=fry:ci ARCH=amd64
          docker run --rm --pull=never fry:ci -help
